<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الوكلاء النخبويين للتعلم الذاتي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        h1, h2 {
            color: #38bdf8;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: #0f172a;
            color: #f8fafc;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #059669;
        }
        .status-box {
            padding: 12px;
            border-radius: 8px;
            background-color: #0f172a;
            border-right: 4px solid #38bdf8;
            margin-top: 12px;
        }
        .result-item {
            background-color: #0f172a;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            border: 1px solid #334155;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>منظومة التعلم الذاتي والتراكمي للوكلاء</h1>

    <!-- بطاقة المهمة الكبرى -->
    <div class="card">
        <h2>مهمة الوكلاء الكبرى</h2>
        <textarea id="promptInput">ابتكار جهاز تنقية الأكسجين المحمول، دراسة تاريخ العلوم، وصياغة نواة لغة برمجة جديدة وآمنة سيبرانياً.</textarea>
        <button onclick="startResearch()">بدء الأبحاث المستقلة وإصدار النتائج</button>
        <div id="statusBox" class="status-box" style="display: none;"></div>
    </div>

    <!-- سجل الأوراق البحثية -->
    <div class="card">
        <h2>سجل الأوراق البحثية والابتكارات 📜</h2>
        <div id="resultsContainer">
            <p style="text-align: center; color: #94a3b8;">جاري تحميل النتائج المحفوظة...</p>
        </div>
    </div>
</div>

<script>
    // دالة بدء البحث في الخلفية (POST)
    async function startResearch() {
        const prompt = document.getElementById("promptInput").value;
        const statusBox = document.getElementById("statusBox");
        
        statusBox.style.display = "block";
        statusBox.innerHTML = "🚀 تم إرسال المهمة! الوكلاء يعملون الآن في الخلفية... يمكنك إغلاق الصفحة والعودة في أي وقت.";

        try {
            const response = await fetch('/start-research', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt })
            });
            const data = await response.json();
            statusBox.innerHTML = "✅ " + data.message;
            
            // تحديث السجل بعد ثانيتين
            setTimeout(fetchResults, 2000);
        } catch (error) {
            statusBox.innerHTML = "⚠️ حدث خطأ أثناء التواصل مع الخادم: " + error;
        }
    }

    // دالة جلب الأبحاث المحفوظة في السجل (GET)
    async function fetchResults() {
        try {
            const response = await fetch('/get-results');
            const data = await response.json();
            const container = document.getElementById("resultsContainer");
            
            if (!data.results || data.results.length === 0) {
                container.innerHTML = "<p style='text-align: center; color: #94a3b8;'>لا توجد أوراق بحثية مكتملة في السجل حتى الآن. اضغط زر البدء لبدء الحلقة!</p>";
                return;
            }

            container.innerHTML = "";
            data.results.reverse().forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "result-item";
                div.innerHTML = `
                    <h3 style="color: #38bdf8;">📌 الإنجاز #${data.results.length - index}: ${item.prompt}</h3>
                    <p><strong>الحالة:</strong> ${item.status}</p>
                    <hr style="border-color: #334155;">
                    <div>${item.result}</div>
                `;
                container.appendChild(div);
            });
        } catch (error) {
            console.error("خطأ في جلب النتائج:", error);
        }
    }

    // جلب النتائج تلقائياً عند فتح الصفحة وتحديثها كل 10 ثوانٍ
    fetchResults();
    setInterval(fetchResults, 10000);
</script>

</body>
</html>
