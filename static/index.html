<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Elite Multi-Agent Ecosystem</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
        h1 { color: #58a6ff; text-align: center; }
        .container { max-width: 900px; margin: auto; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .alert-box { background: #8957e5; color: #fff; padding: 15px; border-radius: 6px; margin-bottom: 20px; display: none; animation: fadeIn 0.5s; }
        button { background: #238636; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; }
        button:hover { background: #2ea043; }
        pre { background: #010409; padding: 10px; border-radius: 5px; overflow-x: auto; color: #7ee787; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>منظومة الوكلاء النخبويين الخارقة</h1>
        
        <!-- نافذة التنبيه الخاصة بالإنجازات التاريخية (بدون صوت) -->
        <div id="popupAlert" class="alert-box">
            <h3 id="alertTitle">🚨 تنبيه إنجاز تاريخي!</h3>
            <p id="alertDesc"></p>
        </div>

        <div class="card">
            <h3>إرسال مهمة بحثية كبرى للوكلاء</h3>
            <input type="text" id="queryInput" value="Solve unsolved Navier-Stokes equations and evolve NovaLang core." style="width: 70%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 4px;">
            <button onclick="sendQuery()">بدء الأبحاث المكثفة</button>
        </div>

        <div class="card">
            <h3>سجل الاكتشافات والأحداث الحية (WebSocket)</h3>
            <pre id="logArea">جاري الاتصال بالنظام...</pre>
        </div>
    </div>

    <script>
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);
        const logArea = document.getElementById('logArea');
        const popupAlert = document.getElementById('popupAlert');
        const alertTitle = document.getElementById('alertTitle');
        const alertDesc = document.getElementById('alertDesc');

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            // التعامل مع الإشعارات الخاصة للاكتشافات التاريخية غير المسبوقة (بدون أصوات)
            if (data.type === "SPECIAL_PRIORITY_ALERT") {
                alertTitle.innerText = data.title;
                alertDesc.innerText = `${data.data.agent} (${data.data.domain}): ${data.data.details}`;
                popupAlert.style.display = "block";
                
                // إخفاء التنبيه تلقائياً بعد 8 ثوانٍ
                setTimeout(() => {
                    popupAlert.style.display = "none";
                }, 8000);
            }

            logArea.innerText = JSON.stringify(data, null, 2) + "\n\n" + logArea.innerText;
        };

        function sendQuery() {
            const query = document.getElementById('queryInput').value;
            ws.send(JSON.stringify({ query: query }));
        }
    </script>
</body>
</html>
